name: Build App

# Manual-only since #11946. The hosted 7 GB runner can no longer build this tree — 19 of
# the last 30 runs died with "The runner has received a shutdown signal" (VM out of
# memory) ~8 min into `next build`, release/v3.8.51 itself included, even with the 10 GB
# swapfile below. Triggered on `push: branches: ["**"]` it painted every branch and every
# PR red while producing an artefact nothing downloads. The bundle is validated where a
# build actually fits:
#   - main:       ci.yml `Build` (self-hosted omni-build pool) on every merge
#   - release/**: nightly-release-green.yml (same pool, continuous)
# Dispatch this workflow by hand when a hosted build artefact is genuinely needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Native production build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: a-arm64-node26
            runner: ubuntu-24.04-arm
            node: "26.12.1"
            arch: arm64
            abi: "147"
            pm2: "6.0.8"
          - target: b-x64-node24
            runner: ubuntu-24.04
            node: "24.22.1"
            arch: x64
            abi: "137"
            pm2: "7.0.4"
    runs-on: ${{ matrix.runner }}
    if: github.repository == 'fouadSalkini/OmniRoute'
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_ABI: ${{ matrix.abi }}
      EXPECTED_NODE: ${{ matrix.node }}
      PM2_VERSION: ${{ matrix.pm2 }}
    steps:
      - name: Expand Virtual Memory (Native 10GB Swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: "skip"

      - name: Build Next.js app & CLI bundle
        run: |
          npm run build:release
        env:
          # Hosted artifact builds run with less memory than the opt-in 64 GB
          # CI build slot. Keep Webpack here without overriding the latter's
          # separately measured Turbopack policy (#16169). Validated 2026-10-18 on the
          # hosted runner (run 39151150605): webpack compiled in 7.1 min, job 17 min.
          # This is the floor docker-publish.yml must not go below
          # (tests/unit/docker-publish-build-heap-14325.test.ts).
          NODE_OPTIONS: "--max-old-space-size=10240"
          OMNIROUTE_BUILD_MEMORY_MB: "10240"
          OMNIROUTE_USE_TURBOPACK: "0"

      - name: Verify native artifact and actual PM2 entrypoint
        run: |
          sudo mkdir /opt/omniroute-ci-pm2
          sudo chown "$(id -u):$(id -g)" /opt/omniroute-ci-pm2
          npm install --prefix /opt/omniroute-ci-pm2 --no-audit --no-fund --ignore-scripts "pm2@$PM2_VERSION"
          sudo --preserve-env=EXPECTED_ARCH,EXPECTED_ABI,EXPECTED_NODE,GITHUB_SHA unshare --net "$(command -v node)" scripts/ci/qualify-native-artifact.mjs dist

      - name: Archive qualified runtime only
        run: |
          node scripts/ci/qualify-native-artifact.mjs dist --verify
          tar --owner=0 --group=0 --numeric-owner -czf _artifacts/native-artifact/omniroute-build.tar.gz dist

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: omniroute-build-${{ matrix.target }}
          path: _artifacts/native-artifact/
          retention-days: 7
