name: Build App

# Fork-only qualification harness. The production candidate remains unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  unit:
    name: Unit ${{ matrix.subject }} ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        subject: [candidate, upstream, deployed]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - subject: candidate
            source: effb7c2f8a12b99507c862944bd5bad6b1cc4618
          - subject: upstream
            source: b2a64106c9e47d654012d24d5ae5424c950649cc
          - subject: deployed
            source: 1b776e1e914aabe3c90b565d352b72cbcc1c3c9f
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - name: Record source identity
        run: |
          mkdir -p _artifacts/qualification
          git rev-parse HEAD > _artifacts/qualification/source.txt
          sha256sum package-lock.json > _artifacts/qualification/lockfile.txt
          node -p 'JSON.stringify(process.versions)' > _artifacts/qualification/runtime.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete shard with coverage
        env:
          TEST_SHARD: ${{ matrix.shard }}/8
        run: |
          set +e
          node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync("_artifacts/qualification/run-shard.cjs", `
          const { spawnSync } = require("node:child_process");
          const script = require(process.cwd() + "/package.json").scripts["test:unit:ci:shard"];
          process.env.PATH = process.cwd() + "/node_modules/.bin:" + process.env.PATH;
          let failed = false;
          for (const command of script.split(" && ")) {
            const child = spawnSync(command, { shell: true, stdio: "inherit", env: process.env });
            if (child.status !== 0) failed = true;
          }
          process.exitCode = failed ? 1 : 0;
          `);
          NODE
          ./node_modules/.bin/c8 --merge-async --temp-directory _artifacts/qualification/coverage-tmp --reports-dir _artifacts/qualification/coverage --exclude='tests/**' --exclude='**/*.test.*' --reporter=json --reporter=json-summary --reporter=text-summary node _artifacts/qualification/run-shard.cjs > _artifacts/qualification/unit.log 2>&1
          status=$?
          printf '%s\n' "$status" > _artifacts/qualification/exit.txt
          tail -n 45 _artifacts/qualification/unit.log
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ matrix.subject }}-unit-${{ matrix.shard }}
          path: _artifacts/qualification/
          retention-days: 7

  dependency-audit:
    name: Dependency audit ${{ matrix.subject }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: candidate
            source: effb7c2f8a12b99507c862944bd5bad6b1cc4618
          - subject: deployed
            source: 1b776e1e914aabe3c90b565d352b72cbcc1c3c9f
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Capture advisories without changing lockfiles
        run: |
          mkdir -p _artifacts/qualification
          git rev-parse HEAD > _artifacts/qualification/source.txt
          sha256sum package-lock.json electron/package-lock.json > _artifacts/qualification/lockfiles.txt
          set +e
          npm audit --json > _artifacts/qualification/root-audit.json
          printf '%s\n' "$?" > _artifacts/qualification/root-audit-exit.txt
          npm audit --omit=dev --json > _artifacts/qualification/root-runtime-audit.json
          printf '%s\n' "$?" > _artifacts/qualification/root-runtime-audit-exit.txt
          npm --prefix electron audit --json > _artifacts/qualification/electron-audit.json
          printf '%s\n' "$?" > _artifacts/qualification/electron-audit-exit.txt
          npm --prefix electron audit --omit=dev --json > _artifacts/qualification/electron-runtime-audit.json
          printf '%s\n' "$?" > _artifacts/qualification/electron-runtime-audit-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ matrix.subject }}-audit
          path: _artifacts/qualification/
          retention-days: 7

  candidate-ui:
    name: Candidate Vitest UI and static gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: effb7c2f8a12b99507c862944bd5bad6b1cc4618
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run candidate checks independently
        run: |
          mkdir -p _artifacts/qualification
          git rev-parse HEAD > _artifacts/qualification/source.txt
          set +e
          for check in test:vitest test:vitest:ui typecheck:core typecheck:noimplicit:core check:cycles check:provider-asset-provenance check:vuln-ratchet; do
            label=${check//:/-}
            npm run "$check" > "_artifacts/qualification/$label.log" 2>&1
            printf '%s %s\n' "$check" "$?" >> _artifacts/qualification/check-exits.txt
          done
          cat _artifacts/qualification/check-exits.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-candidate-ui-static
          path: _artifacts/qualification/
          retention-days: 7
